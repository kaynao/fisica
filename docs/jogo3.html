<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Desafio Magnético (Regra da Mão)</title>
    <link rel="stylesheet" href="global.css" />
  </head>
  <body>
    <a href="index.html" class="btn-voltar">⬅ Voltar ao Menu</a>

    <div class="painel-status">
      <div class="pontos-texto">Pontuação: <span id="pontos3">0</span></div>
      <div class="vidas-texto">Vidas: <span id="vidas3">❤️❤️❤️</span></div>
    </div>

    <div class="pergunta">
      A partícula
      <span id="textoParticula" class="nome-particula">Próton (+)</span> entra
      no Campo Magnético.<br />
      <strong>Para qual direção aponta a Força Magnética (F) inicial?</strong>
    </div>

    <div id="legendaCampo" class="legenda-campo"></div>
    <canvas id="campoCanvas" width="800" height="480"></canvas>
    <div id="explicacao" class="explicacao" aria-live="polite"></div>

    <div class="botoes" id="areaBotoes3">
      <button
        onclick="verificarForca('CIMA')"
        onmouseover="destacarSeta('CIMA')"
        onmouseout="destacarSeta(null)"
      >
        Para Cima (⬆)
      </button>
      <button
        onclick="verificarForca('BAIXO')"
        onmouseover="destacarSeta('BAIXO')"
        onmouseout="destacarSeta(null)"
      >
        Para Baixo (⬇)
      </button>
      <button
        onclick="verificarForca('ESQUERDA')"
        onmouseover="destacarSeta('ESQUERDA')"
        onmouseout="destacarSeta(null)"
      >
        Para Esquerda (⬅)
      </button>
      <button
        onclick="verificarForca('DIREITA')"
        onmouseover="destacarSeta('DIREITA')"
        onmouseout="destacarSeta(null)"
      >
        Para Direita (➔)
      </button>
      <button
        onclick="verificarForca('ENTRANDO')"
        onmouseover="destacarSeta('ENTRANDO')"
        onmouseout="destacarSeta(null)"
      >
        Entrando na Tela (⊗)
      </button>
      <button
        onclick="verificarForca('SAINDO')"
        onmouseover="destacarSeta('SAINDO')"
        onmouseout="destacarSeta(null)"
      >
        Saindo da Tela (⊙)
      </button>
    </div>

    <script>
      const canvas = document.getElementById("campoCanvas");
      const ctx = canvas.getContext("2d");
      const CAMPO = { x1: 150, y1: 100, x2: 650, y2: 380 };
      const COR_V = "#f1c40f"; // vetor velocidade (amarelo)
      const COR_F = "#f472b6"; // dica de força ao passar o mouse (rosa)
      const CONTORNO = "rgba(2, 44, 34, 0.95)";
      const DIRS = {
        CIMA: { x: 0, y: -1, z: 0, nome: "Para Cima (⬆)" },
        BAIXO: { x: 0, y: 1, z: 0, nome: "Para Baixo (⬇)" },
        ESQUERDA: { x: -1, y: 0, z: 0, nome: "Para Esquerda (⬅)" },
        DIREITA: { x: 1, y: 0, z: 0, nome: "Para Direita (➔)" },
        ENTRANDO: { x: 0, y: 0, z: -1, nome: "Entrando na Tela (⊗)" },
        SAINDO: { x: 0, y: 0, z: 1, nome: "Saindo da Tela (⊙)" },
      };
      let ultimoT = 0;

      let estado = "ESPERANDO"; // 'ESPERANDO' ou 'ANIMANDO'
      let repeticoes = 0;
      const maxRepeticoes = 2;
      let respostaUsuario = 0;

      let posX, posY, posZ, velX, velY, velZ, raioParticula;
      let rastro = [];
      let animacaoId;

      let pontuacao = 0;
      let vidas = 3;

      let tipoParticula = 1; // 1 (+) ou -1 (-)
      let dirVelocidade = "DIREITA";
      let dirCampo = "ENTRANDO";
      let forcaCorreta = "CIMA";
      let setaHover = null;

      function produtoVetorial(vKey, bKey, q) {
        const v = DIRS[vKey];
        const b = DIRS[bKey];

        // Converte o eixo Y do canvas (positivo para baixo) para o eixo físico.
        const vy = -v.y;
        const by = -b.y;

        // F = q (v × B), considerando o sinal da carga.
        const fx_phys = q * (vy * b.z - v.z * by);
        const fy_phys = q * (v.z * b.x - v.x * b.z);
        const fz_phys = q * (v.x * by - vy * b.x);

        const fx_canvas = Math.sign(fx_phys);
        const fy_canvas = Math.sign(-fy_phys);
        const fz_canvas = Math.sign(fz_phys);

        for (let key in DIRS) {
          if (
            DIRS[key].x === fx_canvas &&
            DIRS[key].y === fy_canvas &&
            DIRS[key].z === fz_canvas
          ) {
            return key;
          }
        }
        return "CIMA";
      }

      function dentroDoCampo() {
        return (
          posX > CAMPO.x1 &&
          posX < CAMPO.x2 &&
          posY > CAMPO.y1 &&
          posY < CAMPO.y2
        );
      }
      function textoComContorno(texto, x, y, cor) {
        ctx.save();
        ctx.lineJoin = "round";
        ctx.lineWidth = 4;
        ctx.strokeStyle = CONTORNO;
        ctx.strokeText(texto, x, y);
        ctx.fillStyle = cor;
        ctx.fillText(texto, x, y);
        ctx.restore();
      }

      function atualizarVidas() {
        let coracoes = "";
        for (let i = 0; i < vidas; i++) coracoes += "❤️";
        for (let i = vidas; i < 3; i++) coracoes += "🖤";
        document.getElementById("vidas3").innerText = coracoes;
      }

      function darFeedback(acertou) {
        document.body.classList.add(acertou ? "acerto" : "erro");
        setTimeout(() => document.body.classList.remove("acerto", "erro"), 400);
      }

      function destacarSeta(sentido) {
        setaHover = sentido;
        if (estado === "ESPERANDO") desenhar();
      }

      function gerarNovoDesafio() {
        setaHover = null;
        if (vidas <= 0) return;

        tipoParticula = Math.random() > 0.5 ? 1 : -1;

        // Sistema de níveis por pontuação
        if (pontuacao < 30) {
          // Nível 1: Movimento básico para a direita
          dirVelocidade = "DIREITA";
          dirCampo = Math.random() > 0.5 ? "ENTRANDO" : "SAINDO";
        } else if (pontuacao < 60) {
          // Nível 2: Movimento vindo dos 4 lados em 2D
          const opcoesV = ["DIREITA", "ESQUERDA", "CIMA", "BAIXO"];
          dirVelocidade = opcoesV[Math.floor(Math.random() * opcoesV.length)];
          dirCampo = Math.random() > 0.5 ? "ENTRANDO" : "SAINDO";
        } else {
          // Nível 3: Modo 3D completo
          const todas = Object.keys(DIRS);
          dirVelocidade = todas[Math.floor(Math.random() * todas.length)];

          // Garante que B seja ortogonal a V
          const ortogonais = todas.filter((b) => {
            const v = DIRS[dirVelocidade];
            const bV = DIRS[b];
            return v.x * bV.x + v.y * bV.y + v.z * bV.z === 0;
          });
          dirCampo = ortogonais[Math.floor(Math.random() * ortogonais.length)];
        }

        forcaCorreta = produtoVetorial(dirVelocidade, dirCampo, tipoParticula);
        document.getElementById("legendaCampo").innerText =
          `Campo B: ${DIRS[dirCampo].nome}`;

        estado = "ESPERANDO";
        repeticoes = 0;
        document.getElementById("explicacao").innerText = "";

        const btns = document.querySelectorAll("#areaBotoes3 button");
        btns.forEach((b) => (b.disabled = false));

        const spanParticula = document.getElementById("textoParticula");
        if (tipoParticula === 1) {
          spanParticula.innerText = "Próton (+)";
          spanParticula.style.background = "#e74c3c";
        } else {
          spanParticula.innerText = "Elétron (-)";
          spanParticula.style.background = "#3498db";
        }

        resetarPosicaoParticula();
        desenhar();
      }

      function resetarPosicaoParticula() {
        cancelAnimationFrame(animacaoId);
        rastro = [];
        posZ = 0;
        raioParticula = 14;

        const speed = 5;
        velX = DIRS[dirVelocidade].x * speed;
        velY = DIRS[dirVelocidade].y * speed;
        velZ = DIRS[dirVelocidade].z * speed;

        const cx = canvas.width / 2;
        const cy = (CAMPO.y1 + CAMPO.y2) / 2;
        const inicio = {
          DIREITA: [80, cy],
          ESQUERDA: [canvas.width - 80, cy],
          BAIXO: [cx, 80],
          CIMA: [cx, canvas.height - 80],
        };
        [posX, posY] = inicio[dirVelocidade] || [cx, cy];
      }

      function desenharSeta(x, y, dir, comprimento, espessura, cor) {
        const x2 = x + dir.x * comprimento;
        const y2 = y + dir.y * comprimento;
        const px = -dir.y,
          py = dir.x;
        const t = 8 + espessura * 2; // tamanho da ponta
        const bx = x2 - dir.x * t,
          by = y2 - dir.y * t;

        // duas camadas: contorno escuro (mais grosso) e depois a cor
        const camadas = [
          { cor: CONTORNO, extra: 5 },
          { cor: cor, extra: 0 },
        ];
        ctx.save();
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        for (const c of camadas) {
          ctx.strokeStyle = c.cor;
          ctx.fillStyle = c.cor;
          ctx.lineWidth = espessura + c.extra;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(bx, by);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(x2, y2);
          ctx.lineTo(bx + px * t * 0.6, by + py * t * 0.6);
          ctx.lineTo(bx - px * t * 0.6, by - py * t * 0.6);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        }
        ctx.restore();
      }
      function desenhar() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const cx = canvas.width / 2;
        const cy = (CAMPO.y1 + CAMPO.y2) / 2;
        // quando o canvas encolhe na tela, aumenta as fontes para compensar
        const esc = Math.min(
          1.8,
          Math.max(
            1,
            (0.75 * canvas.width) / (canvas.clientWidth || canvas.width),
          ),
        );
        const rd = Math.max(4, raioParticula);

        if (vidas <= 0) {
          ctx.fillStyle = "white";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.font = `bold ${40 * esc}px Arial`;
          ctx.fillText("FIM DE JOGO!", cx, cy - 30);
          ctx.font = `${20 * esc}px Arial`;
          ctx.fillText(`Você fez ${pontuacao} pontos.`, cx, cy + 20);
          return;
        }

        // 1. Região do campo
        const larg = CAMPO.x2 - CAMPO.x1;
        const alt = CAMPO.y2 - CAMPO.y1;
        ctx.fillStyle = "rgba(16, 185, 129, 0.1)";
        ctx.fillRect(CAMPO.x1, CAMPO.y1, larg, alt);
        ctx.strokeStyle = "#10b981";
        ctx.lineWidth = 1;
        ctx.setLineDash([]);
        ctx.strokeRect(CAMPO.x1, CAMPO.y1, larg, alt);

        // 2. Símbolos do campo (mais discretos e sem aparecer sob a partícula)
        ctx.fillStyle = "rgba(255, 255, 255, 0.25)";
        ctx.font = `${20 * esc}px Arial`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        const B = DIRS[dirCampo];
        const setasB = { CIMA: "↑", BAIXO: "↓", ESQUERDA: "←", DIREITA: "→" };
        const simboloCampo = B.z < 0 ? "⊗" : B.z > 0 ? "⊙" : setasB[dirCampo];

        for (let x = 190; x <= 610; x += 60) {
          for (let y = cy - 100; y <= cy + 100; y += 50) {
            if (Math.hypot(x - posX, y - posY) < rd + 22) continue;
            ctx.fillText(simboloCampo, x, y);
          }
        }

        // 3. Rastro
        if (rastro.length > 0) {
          ctx.beginPath();
          ctx.strokeStyle =
            tipoParticula === 1
              ? "rgba(231, 76, 60, 0.6)"
              : "rgba(52, 152, 219, 0.6)";
          ctx.lineWidth = 3;
          ctx.setLineDash([5, 5]);
          ctx.moveTo(rastro[0].x, rastro[0].y);
          for (let i = 1; i < rastro.length; i++)
            ctx.lineTo(rastro[i].x, rastro[i].y);
          ctx.stroke();
          ctx.setLineDash([]);
        }

        // 4. Partícula (só ela fica com transparência em Z)
        ctx.save();
        ctx.globalAlpha = Math.max(0.2, Math.min(1, 1 + posZ / 100));
        ctx.beginPath();
        ctx.arc(posX, posY, rd, 0, Math.PI * 2);
        ctx.fillStyle = tipoParticula === 1 ? "#e74c3c" : "#3498db";
        ctx.fill();
        ctx.fillStyle = "white";
        ctx.font = `bold ${Math.max(10, rd)}px Arial`;
        ctx.fillText(tipoParticula === 1 ? "+" : "-", posX, posY);
        ctx.restore();

        // 5. Vetor velocidade: nasce na borda da partícula, rótulo depois da ponta
        const dirV = DIRS[dirVelocidade];
        ctx.font = `bold ${15 * esc}px Arial`;
        if (dirV.z === 0) {
          desenharSeta(
            posX + dirV.x * (rd + 2),
            posY + dirV.y * (rd + 2),
            dirV,
            38,
            3,
            COR_V,
          );
          const d = rd + 38 + 14 * esc;
          textoComContorno("v", posX + dirV.x * d, posY + dirV.y * d, COR_V);
        } else {
          textoComContorno(
            dirV.z < 0 ? "v ⊗" : "v ⊙",
            posX + rd + 22 * esc,
            posY - rd - 4,
            COR_V,
          );
        }

        // 6. Dica ao passar o mouse (rosa, para não confundir com o v)
        if (setaHover) {
          const d = DIRS[setaHover];
          if (d.z === 0) {
            // se a dica for paralela a v, desloca um pouco para não sobrepor
            const paralela = d.x * dirV.x + d.y * dirV.y !== 0;
            const desvio = paralela ? 12 : 0;
            const x0 = posX + d.x * (rd + 6) - d.y * desvio;
            const y0 = posY + d.y * (rd + 6) + d.x * desvio;
            desenharSeta(x0, y0, d, 48, 5, COR_F);
            ctx.font = `bold ${16 * esc}px Arial`;
            textoComContorno(
              "F",
              x0 + d.x * 24 - d.y * 16 * esc,
              y0 + d.y * 24 + d.x * 16 * esc,
              COR_F,
            );
          } else {
            // ⊗ / ⊙: selo com fundo escuro, acima (ou abaixo, se faltar espaço)
            const by = posY + (posY > 120 ? -1 : 1) * (rd + 34);
            ctx.beginPath();
            ctx.arc(posX, by, 20, 0, Math.PI * 2);
            ctx.fillStyle = CONTORNO;
            ctx.fill();
            ctx.strokeStyle = COR_F;
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.fillStyle = COR_F;
            ctx.font = "bold 26px Arial";
            ctx.fillText(d.z < 0 ? "⊗" : "⊙", posX, by);
          }
        }
      }

      function atualizarFisica(t = performance.now()) {
        if (vidas <= 0 || estado !== "ANIMANDO") return;

        // fator de tempo: 1 = um frame a 60 Hz; o limite 3 evita saltos se a aba travar
        const k = Math.max(0, Math.min((t - ultimoT) / 16.667, 3));
        ultimoT = t;

        if (dentroDoCampo()) {
          const omega = 0.04 * k;
          const fDir = DIRS[forcaCorreta];

          if (fDir.z === 0) {
            velX += fDir.x * omega * 2;
            velY += fDir.y * omega * 2;
          } else {
            // Aplica variação em Z (profundidade / tamanho da partícula)
            velZ += fDir.z * 0.2 * k;
            raioParticula += fDir.z * 0.25 * k;
          }
        }

        posX += velX * k;
        posY += velY * k;
        posZ += velZ * k;

        if (Math.random() > 0.5) rastro.push({ x: posX, y: posY });
        desenhar();

        if (
          posX < 20 ||
          posX > canvas.width - 20 ||
          posY < 20 ||
          posY > canvas.height - 20 ||
          raioParticula < 3 ||
          raioParticula > 40
        ) {
          repeticoes++;

          if (repeticoes < maxRepeticoes) {
            resetarPosicaoParticula();
            setTimeout(() => {
              ultimoT = performance.now();
              animacaoId = requestAnimationFrame(atualizarFisica);
            }, 200);
          } else {
            finalizarRodada();
          }
        } else {
          animacaoId = requestAnimationFrame(atualizarFisica);
        }
      }

      function reiniciarJogo() {
        cancelAnimationFrame(animacaoId);
        document.getElementById("explicacao").innerText = "";
        pontuacao = 0;
        vidas = 3;
        document.getElementById("pontos3").innerText = pontuacao;
        atualizarVidas();
        document.getElementById("areaBotoes3").innerHTML = `
        <button onclick="verificarForca('CIMA')" onmouseover="destacarSeta('CIMA')" onmouseout="destacarSeta(null)">Para Cima (⬆)</button>
        <button onclick="verificarForca('BAIXO')" onmouseover="destacarSeta('BAIXO')" onmouseout="destacarSeta(null)">Para Baixo (⬇)</button>
        <button onclick="verificarForca('ESQUERDA')" onmouseover="destacarSeta('ESQUERDA')" onmouseout="destacarSeta(null)">Para Esquerda (⬅)</button>
        <button onclick="verificarForca('DIREITA')" onmouseover="destacarSeta('DIREITA')" onmouseout="destacarSeta(null)">Para Direita (➔)</button>
        <button onclick="verificarForca('ENTRANDO')" onmouseover="destacarSeta('ENTRANDO')" onmouseout="destacarSeta(null)">Entrando na Tela (⊗)</button>
        <button onclick="verificarForca('SAINDO')" onmouseover="destacarSeta('SAINDO')" onmouseout="destacarSeta(null)">Saindo da Tela (⊙)</button>
    `;
        gerarNovoDesafio();
      }

      function verificarForca(chute) {
        setaHover = null;
        if (estado !== "ESPERANDO") return;

        respostaUsuario = chute;
        estado = "ANIMANDO";

        const btns = document.querySelectorAll("#areaBotoes3 button");
        btns.forEach((b) => (b.disabled = true));
        ultimoT = performance.now();
        atualizarFisica();
      }
      function finalizarRodada() {
        const nomeP = tipoParticula === 1 ? "Próton (+)" : "Elétron (-)";
        const nomeV = DIRS[dirVelocidade].nome;
        const nomeB = DIRS[dirCampo].nome;
        const nomeF = DIRS[forcaCorreta].nome;

        document.getElementById("explicacao").innerText =
          `Rodada anterior: ${nomeP} com v ${nomeV} e B ${nomeB} → Força resultante: ${nomeF}.`;

        if (respostaUsuario === forcaCorreta) {
          pontuacao += 10;
          darFeedback(true);
        } else {
          vidas--;
          atualizarVidas();
          darFeedback(false);
        }

        document.getElementById("pontos3").innerText = pontuacao;

        if (vidas <= 0) {
          cancelAnimationFrame(animacaoId);
          desenhar();
          document.getElementById("areaBotoes3").innerHTML =
            `<button onclick="reiniciarJogo()">Tentar Novamente</button>`;
        } else {
          gerarNovoDesafio();
        }
      }

      atualizarVidas();
      gerarNovoDesafio();
      window.addEventListener("resize", () => {
        if (estado === "ESPERANDO") desenhar();
      });
    </script>

    <footer class="app-footer">
      <p>Desenvolvido por <strong>@kaynao</strong></p>
    </footer>
  </body>
</html>
