<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Interação de Cargas (Lei de Coulomb)</title>
    <link rel="stylesheet" href="estilo2.css" />
  </head>
  <body>
    <div class="painel-status">
      <div class="pontos-texto">Pontuação: <span id="pontos2">0</span></div>
      <div class="vidas-texto">Vidas: <span id="vidas2">❤️❤️❤️</span></div>
    </div>

    <div class="pergunta">
      A Carga Central é conhecida. Observe a órbita da Carga Misteriosa
      (cinza).<br />
      <strong>Qual é o sinal da Carga Misteriosa?</strong>
    </div>

    <canvas id="coulombCanvas" width="700" height="400"></canvas>

    <div class="botoes" id="areaBotoes2">
      <button
        class="btn-misterio-positivo"
        onclick="verificarInteracao(1)"
        onmouseover="destacarParticula(1)"
        onmouseout="destacarParticula(0)"
      >
        A Misteriosa é Positiva (+)
      </button>
      <button
        class="btn-misterio-negativo"
        onclick="verificarInteracao(-1)"
        onmouseover="destacarParticula(-1)"
        onmouseout="destacarParticula(0)"
      >
        A Misteriosa é Negativa (-)
      </button>
    </div>

    <script>
      const canvas = document.getElementById("coulombCanvas");
      const ctx = canvas.getContext("2d");

      let posX, posY, velX, velY;
      let rastro = [];
      let animacaoId;

      let pontuacao = 0;
      let vidas = 3;

      let carga1 = { x: 260, y: 200, tipo: 1 };
      let carga2 = { x: 440, y: 200, tipo: -1 };
      let usarDipolo = false; // Ativado quando o jogador atinge 30 pontos
      let cargaMisteriosa = 1;
      let posYInicial = 200; // Guarda a posição de entrada para repetir a mesma animação

      let corMisteriosa = "#95a5a6"; // Cinza mistério
      let simboloMisteriosa = "?";

      const centroX = 350;
      const centroY = 200;

      function destacarParticula(opcao) {
        if (vidas <= 0) return;
        if (opcao === 1) {
          corMisteriosa = "#e74c3c"; // Vermelho
          simboloMisteriosa = "+";
        } else if (opcao === -1) {
          corMisteriosa = "#3498db"; // Azul
          simboloMisteriosa = "-";
        } else {
          corMisteriosa = "#95a5a6"; // Cinza
          simboloMisteriosa = "?";
        }
      }

      function atualizarVidas() {
        let coracoes = "";
        for (let i = 0; i < vidas; i++) coracoes += "❤️";
        for (let i = vidas; i < 3; i++) coracoes += "🖤";
        document.getElementById("vidas2").innerText = coracoes;
      }

      function darFeedback(acertou) {
        const corOriginal = "#0f172a";
        document.body.style.backgroundColor = acertou ? "#064e3b" : "#7f1d1d";
        setTimeout(() => {
          document.body.style.backgroundColor = corOriginal;
        }, 400);
      }

      // Função 1: Cria um desafio novo do zero (só roda quando acerta/erra)
      function gerarNovoDesafio() {
        if (vidas <= 0) return;

        // Ativa o Dipolo Elétrico se a pontuação for maior ou igual a 30
        usarDipolo = pontuacao >= 30;

        // Sorteia os sinais das cargas fixas
        carga1.tipo = Math.random() > 0.5 ? 1 : -1;
        carga2.tipo = -carga1.tipo; // Garantimos dipolo (uma + e outra -)

        cargaMisteriosa = Math.random() > 0.5 ? 1 : -1;
        posYInicial = Math.random() > 0.5 ? 140 : 260;

        iniciarAnimacao();
      }

      // Função 2: Roda a animação do desafio atual
      function iniciarAnimacao() {
        cancelAnimationFrame(animacaoId);
        posX = 50;
        posY = posYInicial; // Usa sempre a mesma posição sorteada no desafio
        velX = 4;
        velY = 0;
        rastro = [];

        atualizarFisica();
      }

      function desenhar() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (vidas <= 0) {
          ctx.fillStyle = "white";
          ctx.font = "bold 40px Arial";
          ctx.textAlign = "center";
          ctx.fillText("FIM DE JOGO!", 350, 180);
          ctx.font = "20px Arial";
          ctx.fillText(`Você fez ${pontuacao} pontos.`, 350, 230);
          return;
        }

        if (usarDipolo) {
          // Carga 1
          ctx.beginPath();
          ctx.arc(carga1.x, carga1.y, 18, 0, Math.PI * 2);
          ctx.fillStyle = carga1.tipo === 1 ? "#e74c3c" : "#3498db";
          ctx.fill();
          ctx.fillStyle = "white";
          ctx.font = "20px Arial";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(carga1.tipo === 1 ? "+" : "-", carga1.x, carga1.y);

          // Carga 2
          ctx.beginPath();
          ctx.arc(carga2.x, carga2.y, 18, 0, Math.PI * 2);
          ctx.fillStyle = carga2.tipo === 1 ? "#e74c3c" : "#3498db";
          ctx.fill();
          ctx.fillStyle = "white";
          ctx.font = "20px Arial";
          ctx.fillText(carga2.tipo === 1 ? "+" : "-", carga2.x, carga2.y);
        } else {
          // Carga Central única (Nível 1)
          ctx.beginPath();
          ctx.arc(350, 200, 20, 0, Math.PI * 2);
          ctx.fillStyle = carga1.tipo === 1 ? "#e74c3c" : "#3498db";
          ctx.fill();
          ctx.fillStyle = "white";
          ctx.font = "24px Arial";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(carga1.tipo === 1 ? "+" : "-", 350, 200);
        }

        if (rastro.length > 0) {
          ctx.beginPath();
          ctx.strokeStyle = "rgba(149, 165, 166, 0.6)";
          ctx.lineWidth = 3;
          ctx.setLineDash([5, 5]);
          ctx.moveTo(rastro[0].x, rastro[0].y);
          for (let i = 1; i < rastro.length; i++)
            ctx.lineTo(rastro[i].x, rastro[i].y);
          ctx.stroke();
          ctx.setLineDash([]);
        }

        ctx.beginPath();
        ctx.arc(posX, posY, 14, 0, Math.PI * 2);
        ctx.fillStyle = corMisteriosa;
        ctx.fill();
        ctx.fillStyle = corMisteriosa === "#95a5a6" ? "black" : "white";
        ctx.font = "bold 16px Arial";
        ctx.fillText(simboloMisteriosa, posX, posY);
      }

      function atualizarFisica() {
        if (vidas <= 0) return;

        let posX1 = usarDipolo ? carga1.x : 350;
        let posY1 = usarDipolo ? carga1.y : 200;
        let dx1 = posX - posX1;
        let dy1 = posY - posY1;
        let dist1 = Math.max(Math.sqrt(dx1 * dx1 + dy1 * dy1), 20);

        let forca1 = (carga1.tipo * cargaMisteriosa * 1500) / (dist1 * dist1);
        let ax1 = forca1 * (dx1 / dist1);
        let ay1 = forca1 * (dy1 / dist1);

        // Força da Carga 2 (Apenas se o Dipolo estiver ativo)
        let ax2 = 0,
          ay2 = 0;
        if (usarDipolo) {
          let dx2 = posX - carga2.x;
          let dy2 = posY - carga2.y;
          let dist2 = Math.max(Math.sqrt(dx2 * dx2 + dy2 * dy2), 20);

          let forca2 = (carga2.tipo * cargaMisteriosa * 1500) / (dist2 * dist2);
          ax2 = forca2 * (dx2 / dist2);
          ay2 = forca2 * (dy2 / dist2);
        }

        // Aceleração Resultante (Soma vetorial das forças)
        velX += ax1 + ax2;
        velY += ay1 + ay2;

        posX += velX;
        posY += velY;

        if (Math.random() > 0.5) rastro.push({ x: posX, y: posY });
        desenhar();

        if (posX > 750 || posX < -50 || posY > 450 || posY < -50) {
          setTimeout(iniciarAnimacao, 500);
        } else {
          animacaoId = requestAnimationFrame(atualizarFisica);
        }
      }

      function reiniciarJogo() {
        pontuacao = 0;
        vidas = 3;
        document.getElementById("pontos2").innerText = pontuacao;
        atualizarVidas();

        // Atualizamos a criação dos botões para incluir os efeitos do mouse aqui também
        document.getElementById("areaBotoes2").innerHTML = `
                <button class="btn-misterio-positivo" onclick="verificarInteracao(1)" onmouseover="destacarParticula(1)" onmouseout="destacarParticula(0)">A Misteriosa é Positiva (+)</button>
                <button class="btn-misterio-negativo" onclick="verificarInteracao(-1)" onmouseover="destacarParticula(-1)" onmouseout="destacarParticula(0)">A Misteriosa é Negativa (-)</button>
            `;
        gerarNovoDesafio();
      }

      function verificarInteracao(chute) {
        destacarParticula(0); // Reseta a cor para cinza na hora do clique

        if (chute === cargaMisteriosa) {
          pontuacao += 10;
          darFeedback(true);
        } else {
          vidas--;
          atualizarVidas();
          darFeedback(false);
        }
        document.getElementById("pontos2").innerText = pontuacao;

        if (vidas <= 0) {
          cancelAnimationFrame(animacaoId);
          desenhar();
          document.getElementById("areaBotoes2").innerHTML =
            `<button onclick="reiniciarJogo()">Tentar Novamente</button>`;
        } else {
          gerarNovoDesafio();
        }
      }

      atualizarVidas();
      gerarNovoDesafio(); // Inicia o jogo a primeira vez
    </script>
    <br />
    <a href="index.html" class="btn-voltar">⬅ Voltar ao Menu</a>
  </body>
</html>
