<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Desafio Eletrostático</title>
    <link rel="stylesheet" href="estilo.css">
    <style>
        /* Regras extras apenas para o cabeçalho de vidas */
        .painel-status {
            display: flex;
            gap: 50px;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .pontos-texto { color: #f1c40f; }
        .vidas-texto { color: #e74c3c; }
    </style>
</head>
<body>

    <div class="painel-status">
        <div class="pontos-texto">Pontuação: <span id="pontos">0</span></div>
        <div class="vidas-texto">Vidas: <span id="vidas">❤️❤️❤️</span></div>
    </div>
    
    <div class="pergunta">
        Observe a trajetória do <span id="textoParticula" class="nome-particula proton-text">Próton (+)</span>.<br>
        Quais são os sinais das placas?
    </div>

    <canvas id="jogoCanvas" width="700" height="400"></canvas>
    
    <div class="botoes" id="areaBotoes">
        <button onclick="verificarResposta(1)" onmouseover="destacarPlacas(1)" onmouseout="destacarPlacas(0)">Placa Superior (+) / Inferior (-)</button>
        <button onclick="verificarResposta(-1)" onmouseover="destacarPlacas(-1)" onmouseout="destacarPlacas(0)">Placa Superior (-) / Inferior (+)</button>
    </div>

    <script>
        const canvas = document.getElementById('jogoCanvas');
        const ctx = canvas.getContext('2d');

        let posX, posY, velX, velY, aceleracaoY;
        let rastro = [];
        let animacaoId;
        
        let pontuacao = 0;
        let vidas = 3; // NOVO: Sistema de vidas
        let tipoParticula = 1; 
        let sinalPlacaSuperior = 1; 

        let corPlacaSup = '#7f8c8d'; 
        let corPlacaInf = '#7f8c8d'; 
        let textoPlacaSup = "Placa Superior ?";
        let textoPlacaInf = "Placa Inferior ?";

        function atualizarVidas() {
            let coracoes = "";
            for(let i=0; i<vidas; i++) coracoes += "❤️";
            for(let i=vidas; i<3; i++) coracoes += "🖤"; // Corações vazios
            document.getElementById('vidas').innerText = coracoes;
        }

        function destacarPlacas(opcao) {
            if (vidas === 0) return; // Bloqueia se o jogo acabou
            if (opcao === 1) {
                corPlacaSup = 'rgba(231, 76, 60, 0.8)';
                corPlacaInf = 'rgba(52, 152, 219, 0.8)';
                textoPlacaSup = "Placa Superior (+)";
                textoPlacaInf = "Placa Inferior (-)";
            } else if (opcao === -1) {
                corPlacaSup = 'rgba(52, 152, 219, 0.8)';
                corPlacaInf = 'rgba(231, 76, 60, 0.8)';
                textoPlacaSup = "Placa Superior (-)";
                textoPlacaInf = "Placa Inferior (+)";
            } else {
                corPlacaSup = '#7f8c8d'; 
                corPlacaInf = '#7f8c8d'; 
                textoPlacaSup = "Placa Superior ?";
                textoPlacaInf = "Placa Inferior ?";
            }
        }

        function darFeedbackVisual(acertou) {
            const corOriginal = '#1e1e1e';
            const corAcerto = '#14522d'; 
            const corErro = '#5c1616';   
            document.body.style.backgroundColor = acertou ? corAcerto : corErro;
            setTimeout(() => { document.body.style.backgroundColor = corOriginal; }, 400);
        }

        function gerarNovoDesafio() {
            if (vidas <= 0) return; // Se perdeu, não gera novo
            tipoParticula = Math.random() > 0.5 ? 1 : -1;
            sinalPlacaSuperior = Math.random() > 0.5 ? 1 : -1;
            
            const spanParticula = document.getElementById('textoParticula');
            spanParticula.innerText = tipoParticula === 1 ? "Próton (+)" : "Elétron (-)";
            spanParticula.className = tipoParticula === 1 ? "nome-particula proton-text" : "nome-particula eletron-text";

            iniciarAnimacao();
        }

        function iniciarAnimacao() {
            cancelAnimationFrame(animacaoId);
            posX = 50; posY = 200; velX = 6; velY = 0; rastro = [];
            aceleracaoY = tipoParticula * sinalPlacaSuperior * 0.08;
            atualizarFisica();
        }

        function desenharCenario() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Se o jogo acabou, mostra a tela de Game Over
            if (vidas <= 0) {
                ctx.fillStyle = 'white';
                ctx.font = 'bold 40px Arial';
                ctx.textAlign = 'center';
                ctx.fillText("FIM DE JOGO!", 350, 180);
                ctx.font = '20px Arial';
                ctx.fillText(`Você fez ${pontuacao} pontos.`, 350, 230);
                return;
            }

            ctx.fillStyle = corPlacaSup; ctx.fillRect(100, 50, 500, 20); 
            ctx.fillStyle = corPlacaInf; ctx.fillRect(100, 330, 500, 20); 
            
            ctx.fillStyle = 'white'; ctx.font = '18px Arial'; ctx.textAlign = 'center';
            ctx.fillText(textoPlacaSup, 350, 40); ctx.fillText(textoPlacaInf, 350, 370);

            if (rastro.length > 0) {
                ctx.beginPath();
                ctx.strokeStyle = tipoParticula === 1 ? 'rgba(231, 76, 60, 0.6)' : 'rgba(52, 152, 219, 0.6)';
                ctx.lineWidth = 3; ctx.setLineDash([5, 5]);
                ctx.moveTo(rastro[0].x, rastro[0].y);
                for (let i = 1; i < rastro.length; i++) ctx.lineTo(rastro[i].x, rastro[i].y);
                ctx.stroke(); ctx.setLineDash([]); 
            }

            ctx.beginPath();
            ctx.arc(posX, posY, 14, 0, Math.PI * 2);
            ctx.fillStyle = tipoParticula === 1 ? '#e74c3c' : '#3498db';
            ctx.fill();
            ctx.fillStyle = 'white'; ctx.textBaseline = 'middle';
            ctx.fillText(tipoParticula === 1 ? '+' : '-', posX, posY);
        }

        function atualizarFisica() {
            if (vidas <= 0) return;
            posX += velX; velY += aceleracaoY; posY += velY;
            if (Math.random() > 0.5) rastro.push({x: posX, y: posY});
            desenharCenario();

            if (posX > 650 || posY < 75 || posY > 325) setTimeout(iniciarAnimacao, 500); 
            else animacaoId = requestAnimationFrame(atualizarFisica);
        }

        function reiniciarJogo() {
            pontuacao = 0; vidas = 3;
            document.getElementById('pontos').innerText = pontuacao;
            atualizarVidas();
            document.getElementById('areaBotoes').innerHTML = `
                <button onclick="verificarResposta(1)" onmouseover="destacarPlacas(1)" onmouseout="destacarPlacas(0)">Placa Superior (+) / Inferior (-)</button>
                <button onclick="verificarResposta(-1)" onmouseover="destacarPlacas(-1)" onmouseout="destacarPlacas(0)">Placa Superior (-) / Inferior (+)</button>
            `;
            gerarNovoDesafio();
        }

        function verificarResposta(chutePlacaSuperior) {
            destacarPlacas(0);
            if (chutePlacaSuperior === sinalPlacaSuperior) {
                pontuacao += 10;
                darFeedbackVisual(true);
            } else {
                vidas--; // Perde vida
                atualizarVidas();
                darFeedbackVisual(false);
            }
            document.getElementById('pontos').innerText = pontuacao;
            
            if (vidas <= 0) {
                cancelAnimationFrame(animacaoId);
                desenharCenario(); // Mostra a tela de Game Over
                document.getElementById('areaBotoes').innerHTML = `<button onclick="reiniciarJogo()">Tentar Novamente</button>`;
            } else {
                gerarNovoDesafio(); 
            }
        }

        atualizarVidas();
        gerarNovoDesafio();
    </script>
    <br>
    <a href="index.html" class="btn-voltar">⬅ Voltar ao Menu</a>
</body>
</html>
